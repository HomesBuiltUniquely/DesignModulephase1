# Add inside  http { ... }  in /etc/nginx/nginx.conf (or a conf.d file loaded from http{}).
#
# 1) WebSocket upgrade map — required for inbox live updates on api.hubinterior.com.
# Without this, /v1/design/inbox/ws falls through as a plain GET and Express returns 404
# ("WebSocket handshake Unexpected response code: 404").
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 2) OPTIONAL CORS map — only if Nginx returns 413/502 *before* Node and the browser
# only shows a CORS error. Then add matching add_header ... always; lines in the server
# block (avoid `if` + add_header in the same block — nginx quirks).
#
# map $http_origin $cors_allow_origin {
#     default "";
#     "https://design.hubinterior.com"       $http_origin;
#     "https://www.design.hubinterior.com"   $http_origin;
# }
